<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto CÁLCULO I - Calculadora de Límites</title>

  <!-- MathJax para el renderizado de fórmulas LaTeX -->
  <script id="mathjax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Biblioteca mathjs para evaluar expresiones matemáticas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #1a365d;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #2d3748;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #3182ce;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #2c5282;
    }

    /* Estilos del Procedimiento Extenso Estilo Clase */
    .procedimiento-contenedor {
      margin-top: 30px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 6px solid #2b6cb0;
      border-radius: 8px;
      padding: 20px;
      display: none;
    }

    .paso-bloque {
      margin-bottom: 22px;
      padding-bottom: 15px;
      border-bottom: 1px dashed #cbd5e0;
    }

    .paso-bloque:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .paso-titulo {
      color: #1a365d;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 4px;
    }

    .nota-lateral {
      background-color: #fffaf0;
      border-left: 4px solid #dd6b20;
      padding: 10px 14px;
      margin: 10px 0;
      font-size: 0.93rem;
      color: #7b341e;
      border-radius: 0 4px 4px 0;
    }

    .tabla-procedimiento {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.95rem;
    }

    .tabla-procedimiento th, .tabla-procedimiento td {
      border: 1px solid #cbd5e0;
      padding: 10px;
      text-align: center;
    }

    .tabla-procedimiento th {
      background-color: #ebf8ff;
      color: #2b6cb0;
    }

    .caja-resultado-final {
      background-color: #f0fff4;
      border: 2px solid #38a169;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      color: #22543d;
      margin-top: 15px;
    }

    .error-box {
      color: #e53e3e;
      background-color: #fff5f5;
      padding: 10px;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Proyecto CÁLCULO I - Aproximación de Límites</h1>

    <div class="form-group">
      <label for="funcion">Función f(x):</label>
      <input type="text" id="funcion" placeholder="Ej: (x^2 - 9) / (x - 3)">
    </div>

    <div class="form-group">
      <label for="punto">Punto Límite (x → a):</label>
      <input type="number" id="punto" step="any" placeholder="Ej: 3">
    </div>

    <button onclick="calcularLimite()">Calcular y Generar Procedimiento Paso a Paso</button>

    <div id="error" class="error-box"></div>

    <!-- Contenedor del procedimiento detallado -->
    <div id="procedimiento" class="procedimiento-contenedor"></div>
  </div>

  <script>
    function evaluarFuncion(expr, xVal) {
      try {
        return math.evaluate(expr, { x: xVal });
      } catch (e) {
        return NaN;
      }
    }

    function convertirALaTeX(expr) {
      try {
        const node = math.parse(expr);
        return node.toTex();
      } catch (e) {
        return expr;
      }
    }

    function calcularLimite() {
      const exprInput = document.getElementById('funcion').value.trim();
      const puntoInput = parseFloat(document.getElementById('punto').value);
      const divError = document.getElementById('error');
      const divProc = document.getElementById('procedimiento');

      divError.style.display = 'none';
      divError.innerHTML = '';

      if (!exprInput || isNaN(puntoInput)) {
        divError.style.display = 'block';
        divError.innerHTML = 'Por favor, ingresa una función válida y el punto límite.';
        divProc.style.display = 'none';
        return;
      }

      const a = puntoInput;
      const funcionTex = convertirALaTeX(exprInput);

      // Evaluación Directa
      const evalDirecta = evaluarFuncion(exprInput, a);
      let evalDirectaStr = "";
      let esIndeterminado = false;

      if (isNaN(evalDirecta) || !isFinite(evalDirecta)) {
        evalDirectaStr = "\\text{Indeterminado } \\left(\\frac{0}{0} \\text{ o } \\infty\\right)";
        esIndeterminado = true;
      } else {
        evalDirectaStr = evalDirecta.toFixed(4);
      }

      // Tabla de aproximación numérica en 3 puntos
      const h = [0.1, 0.01, 0.001];
      let filasHTML = "";
      let ultIzquierda = 0;
      let ultDerecha = 0;

      for (let i = 0; i < h.length; i++) {
        const xIzq = a - h[i];
        const yIzq = evaluarFuncion(exprInput, xIzq);
        
        const xDerecha = a + h[i];
        const yDerecha = evaluarFuncion(exprInput, xDerecha);

        ultIzquierda = yIzq;
        ultDerecha = yDerecha;

        filasHTML += `
          <tr>
            <td>${xIzq.toFixed(4)}</td>
            <td>${isNaN(yIzq) ? 'Indef.' : yIzq.toFixed(6)}</td>
            <td>${xDerecha.toFixed(4)}</td>
            <td>${isNaN(yDerecha) ? 'Indef.' : yDerecha.toFixed(6)}</td>
          </tr>
        `;
      }

      const limiteEstimado = ((ultIzquierda + ultDerecha) / 2).toFixed(4);

      // Generación del desglose completo estilo cuaderno de clase
      const htmlProcedimiento = `
        <div class="paso-bloque">
          <div class="paso-titulo">1. Declaración e Identificación Formal del Límite</div>
          <p>Se plantea la evaluación del siguiente límite en el punto indicado:</p>
          <p style="text-align: center; margin: 10px 0;">$$\\lim_{x \\to ${a}} \\left( ${funcionTex} \\right)$$</p>
        </div>

        <div class="paso-bloque">
          <div class="paso-titulo">2. Evaluación Directa (Prueba de Indeterminación)</div>
          <p>Sustituyendo $$x = ${a}$$ de forma directa en la función:</p>
          <p style="text-align: center; margin: 10px 0;">$$f(${a}) = ${evalDirectaStr}$$</p>
          ${esIndeterminado ? `
            <div class="nota-lateral">
              <b>Nota de Clase:</b> Se genera una forma indeterminada. Por consiguiente, se aplica el análisis mediante aproximación lateral izquierda ($x < a$) y derecha ($x > a$) en tres puntos de tabulación progresiva.
            </div>
          ` : ''}
        </div>

        <div class="paso-bloque">
          <div class="paso-titulo">3. Construcción de Tabla de Aproximación en 3 Puntos</div>
          <p>Tabulando valores infinitesimalmente cercanos al límite central $$a = ${a}$$:</p>
          <table class="tabla-procedimiento">
            <thead>
              <tr>
                <th>Izquierda ($x < ${a}$)</th>
                <th>$f(x)$</th>
                <th>Derecha ($x > ${a}$)</th>
                <th>$f(x)$</th>
              </tr>
            </thead>
            <tbody>
              ${filasHTML}
            </tbody>
          </table>
        </div>

        <div class="paso-bloque">
          <div class="paso-titulo">4. Análisis Tendencial y Comprobación Lateral</div>
          <p>• Tendencia por la izquierda: $$\\lim_{x \\to ${a}^-} f(x) \\approx ${ultIzquierda.toFixed(4)}$$</p>
          <p>• Tendencia por la derecha: $$\\lim_{x \\to ${a}^+} f(x) \\approx ${ultDerecha.toFixed(4)}$$</p>
          <div class="nota-lateral">
            Dado que los límites laterales convergen al mismo valor, se verifica la existencia del límite bilateral.
          </div>
        </div>

        <div class="caja-resultado-final">
          R // $$\\lim_{x \\to ${a}} \\left( ${funcionTex} \\right) = ${limiteEstimado}$$
        </div>
      `;

      divProc.innerHTML = htmlProcedimiento;
      divProc.style.display = 'block';

      // Renderizar notaciones matemáticas con MathJax
      if (window.MathJax) {
        MathJax.typesetPromise([divProc]);
      }
    }
  </script>
</body>
</html>
